name: Publish Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild generated docs
        run: python scripts/build_project_docs.py

      - name: Commit generated docs if needed
        run: |
          if git diff --quiet -- README.md docs/generated docs/experiment_registry.md; then
            echo "No generated doc changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/generated docs/experiment_registry.md
          git commit -m "[skip ci] Refresh generated docs"
          git push
